name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (precache list, clips)
    runs-on: ubuntu-24.04   # Playwright 1.56 has no browsers for ubuntu-latest (26.04) yet
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/static-checks.mjs

  playwright:
    name: Playwright (phone 390x844, desktop 1280x800)
    runs-on: ubuntu-24.04   # Playwright 1.56 has no browsers for ubuntu-latest (26.04) yet
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test tools
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npx playwright test
        env:
          CI: true
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
